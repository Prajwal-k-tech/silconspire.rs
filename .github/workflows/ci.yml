name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Smoke test solver and reject malformed input
        shell: bash
        run: |
          cargo run --locked --quiet -- --input-file silicon_spire.txt --pack-size 3 --max-iterations 1 --ts-iterations 0
          printf '2\n1 2\n3 4\n5 6\n7\n' > "$RUNNER_TEMP/incomplete.txt"
          if cargo run --locked --quiet -- --input-file "$RUNNER_TEMP/incomplete.txt" --pack-size 3 --max-iterations 1 --ts-iterations 0; then
            echo 'Incomplete input was accepted' >&2
            exit 1
          fi
          printf '2\n1 2\n3 4\n5 6\n7 8\n999\n' > "$RUNNER_TEMP/trailing.txt"
          if cargo run --locked --quiet -- --input-file "$RUNNER_TEMP/trailing.txt" --pack-size 3 --max-iterations 1 --ts-iterations 0; then
            echo 'Trailing input was accepted' >&2
            exit 1
          fi
          printf '2\n2147483647 2147483647\n2147483647 2147483647\n2147483647 2147483647\n2147483647 2147483647\n' > "$RUNNER_TEMP/overflowing.txt"
          if cargo run --locked --quiet -- --input-file "$RUNNER_TEMP/overflowing.txt" --pack-size 3 --max-iterations 1 --ts-iterations 0; then
            echo 'Overflowing objective was accepted' >&2
            exit 1
          fi
